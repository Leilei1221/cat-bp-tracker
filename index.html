<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貓咪血壓記錄</title>
<link id="fav" rel="icon" href="">
<style>
  .faces { display:flex; justify-content:center; gap:8px; margin-bottom:8px; }
  .faces img { width:52px; height:52px; border-radius:16px; background:#fffdf6; box-shadow:0 2px 6px rgba(120,80,40,.15); }
  .faces img:nth-child(odd) { transform:rotate(-5deg); } .faces img:nth-child(even) { transform:rotate(5deg) translateY(3px); }
  .catpick { display:flex; gap:10px; align-items:center; }
  .catpick img { width:52px; height:52px; border-radius:16px; background:#fffdf6; flex:none; box-shadow:0 1px 4px rgba(120,80,40,.15); }
  #msg img { width:36px; height:36px; border-radius:12px; vertical-align:middle; margin-right:6px; }
  :root { --bg:#fff8f0; --card:#fff; --ink:#4a3b32; --accent:#e8895a; --accent-d:#c96d40; --line:#ecd9c8; --ok:#3f9b6a; --err:#d04545; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; }
  main { max-width:440px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.5rem; text-align:center; margin:0 0 16px; }
  form { background:var(--card); border-radius:16px; padding:20px; box-shadow:0 2px 10px rgba(120,80,40,.1); }
  label { display:block; font-weight:600; font-size:.9rem; margin:14px 0 6px; }
  label:first-child { margin-top:0; }
  input, select { width:100%; font-size:1.1rem; padding:12px; border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; min-width:0; }
  input[type=date], input[type=time] { font-size:1rem; padding:12px 8px; min-width:0; }
  .row label { margin-top:14px; }
  button { width:100%; margin-top:20px; font-size:1.15rem; font-weight:700; padding:14px; border:0; border-radius:12px; background:var(--accent); color:#fff; cursor:pointer; }
  button:hover { background:var(--accent-d); }
  button:disabled { opacity:.6; cursor:wait; }
  #msg { margin-top:14px; text-align:center; font-weight:600; min-height:1.4em; }
  #msg.ok { color:var(--ok); } #msg.err { color:var(--err); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <div class="faces" id="faces"></div>
  <h1>貓咪血壓記錄</h1>
  <form id="f">
    <label for="cat">貓咪</label>
    <div class="catpick"><img id="avatar" alt=""><select id="cat" required></select></div>
    <input id="newCat" type="text" placeholder="輸入新貓咪的名字" maxlength="30" hidden style="margin-top:8px">

    <div class="row">
      <div><label for="date">測量日期</label><input id="date" type="date" required></div>
      <div><label for="time">測量時間</label><input id="time" type="time" required></div>
    </div>

    <div class="row">
      <div><label for="sys">收縮壓</label><input id="sys" type="number" inputmode="numeric" min="30" max="300" placeholder="mmHg" required></div>
      <div><label for="dia">舒張壓</label><input id="dia" type="number" inputmode="numeric" min="20" max="250" placeholder="mmHg" required></div>
    </div>

    <label for="pulse">脈搏（次/分）</label>
    <input id="pulse" type="number" inputmode="numeric" min="30" max="400" placeholder="次/分" required>

    <button id="btn" type="submit">送出</button>
    <div id="msg" role="status"></div>
  </form>
</main>

const faceOf = name => {
  let h = 0; for (const ch of name || '') h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return ICONS[h % ICONS.length];
};
$('fav').href = FAV;
$('faces').innerHTML = HEAD.map(s => `<img src="${s}" alt="">`).join('');
function showAvatar() {
  const v = $('cat').value;
  $('avatar').src = v === NEW ? HEAD[0] : faceOf(v);
}
const pad = n => String(n).padStart(2, '0');

function setNow() {
  const n = new Date();
  $('date').value = `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`;
  $('time').value = `${pad(n.getHours())}:${pad(n.getMinutes())}`;
}

function say(text, cls, img) {
  $('msg').textContent = text; $('msg').className = cls || '';
  if (img) { const i = document.createElement('img'); i.src = img; $('msg').prepend(i); }
}

function fillCats(cats, selected) {
  const sel = $('cat');
  sel.innerHTML = '';
  cats.forEach(c => sel.add(new Option(c, c)));
  sel.add(new Option('＋ 新增貓咪', NEW));
  sel.value = selected && cats.includes(selected) ? selected : (cats[0] || NEW);
  toggleNew();
}

function toggleNew() {
  const isNew = $('cat').value === NEW;
  $('newCat').hidden = !isNew;
  $('newCat').required = isNew;
  showAvatar();
}

async function loadCats(selected) {
  try {
    const r = await fetch(GAS_URL);
    const j = await r.json();
    fillCats(j.cats || [], selected);
  } catch (e) {
    fillCats([], selected);
    say('讀不到貓咪名單，可直接新增貓咪名字', 'err');
  }
}

$('cat').addEventListener('change', toggleNew);

$('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const cat = ($('cat').value === NEW ? $('newCat').value : $('cat').value).trim();
  const sys = +$('sys').value, dia = +$('dia').value, pulse = +$('pulse').value;
  if (!cat) return say('請輸入貓咪名字', 'err');
  if (sys <= dia) return say('收縮壓應大於舒張壓，請再確認', 'err');

  $('btn').disabled = true; say('送出中…');
  try {
    // text/plain 可避免 CORS preflight，GAS 才收得到
    const r = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ cat, date: $('date').value, time: $('time').value, systolic: sys, diastolic: dia, pulse })
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '寫入失敗');
    say(`已記錄 ${cat}：${sys}/${dia} mmHg，脈搏 ${pulse}`, 'ok', faceOf(cat));
    ['sys', 'dia', 'pulse'].forEach(id => $(id).value = '');
    $('newCat').value = '';
    setNow();
    loadCats(cat);
  } catch (e) {
    say('送出失敗：' + e.message, 'err');
  } finally {
    $('btn').disabled = false;
  }
});

setNow();
loadCats();
</script>
